<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Relief – Live-Wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #msg {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 2rem; text-align: center; color: #8b90a0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="msg" role="alert">WebGL 2 ist in diesem Browser nicht verfügbar.</div>
<script>
(() => {
'use strict';

/* ============================================================
   Relief – generatives Live-Wallpaper (WebGL 2, keine Abhängigkeiten)
   Einstellungen per URL, z. B.  index.html?bands=6&tint=a78bfa
   ============================================================ */

// ---------- Parameter ----------
const Q = new URLSearchParams(location.search);
const has = k => Q.has(k) && Q.get(k).trim() !== '';
const num = (k, d, lo, hi) => {
  const v = parseFloat(Q.get(k));
  return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d;
};
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function parseSeed() {
  if (!has('seed')) return (Math.random() * 4294967296) >>> 0;
  const s = Q.get('seed').trim();
  return /^\d+$/.test(s) ? (Number(s) >>> 0) : hashStr(s);
}

const P = {
  bands:   num('bands', 5, 2, 16),          // Bandbreite: Anzahl Bänder über die kurze Bildschirmseite
  morph:   num('morph', reduceMotion ? 0 : 22, 0, 3600), // Sekunden zwischen Umbauten (0 = aus)
  changes: Math.round(num('changes', 3, 1, 12)),         // Umbauten pro Durchgang
  speed:   num('speed', 1, 0, 10),          // Tempo aller Bewegungen
  light:   num('light', 1, 0, 4),           // Helligkeit
  line:    num('line', 1, 0, 4),            // Stärke der feinen Lichtkanten
  fps:     num('fps', 60, 1, 240),          // Bildrate während Übergängen
  idle:    num('idle', 30, 1, 240),         // Bildrate in ruhigen Phasen
  scale:   num('scale', 1, 0.25, 2),        // Renderauflösung relativ zum Display
  seed:    parseSeed(),                     // gleiches Muster bei gleichem Seed
  freeze:  has('freeze') ? num('freeze', 12, 0, 1e6) : null, // Standbild nach x Sekunden
};
if (P.speed === 0 && P.freeze === null) P.freeze = 8;

function parseTint(s) {
  const def = [0.68, 0.74, 1.0];           // kühles Blaugrau (linear)
  if (!s) return def;
  s = s.trim().replace(/^#/, '');
  if (/^[0-9a-f]{3}$/i.test(s)) s = s.replace(/./g, c => c + c);
  if (!/^[0-9a-f]{6}$/i.test(s)) return def;
  const lin = [0, 2, 4].map(i => {
    const v = parseInt(s.slice(i, i + 2), 16) / 255;
    return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  const m = Math.max(lin[0], lin[1], lin[2]);
  return m < 1e-4 ? [1, 1, 1] : lin.map(v => v / m);
}
const TINT = parseTint(Q.get('tint'));
const RIM_TINT = TINT.map(c => c + (1 - c) * 0.35);

// ---------- Zufall ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(P.seed);
const PH = (() => { const r = mulberry32(P.seed ^ 0x9E3779B9); return [r(), r(), r(), r()].map(v => v * Math.PI * 2); })();

// ---------- Shader ----------
const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
precision highp int;

uniform vec2  uRes;       // Zeichenfläche in Pixeln
uniform vec2  uOrigin;    // Gitterursprung (Pixel, y nach unten)
uniform float uS;         // Bandbreite in Pixeln
uniform sampler2D uMask;  // R = aktuelles Labyrinth, G = nächstes
uniform ivec2 uGrid;
uniform int   uMorph;     // 1 während eines Übergangs
uniform float uT;         // Sekunden seit Übergangsbeginn
uniform vec2  uDur;       // (Durchlauf, lokale Dauer)
uniform vec3  uFront;     // Front: f = dot(p, xy) + z
uniform vec3  uWob;       // Wellenform der Front
uniform vec2  uKey;       // Richtung zum Hauptlicht (Bildschirm, y nach unten)
uniform vec3  uPL;        // wanderndes Licht (x, y, Höhe) in Pixeln
uniform vec3  uTint;
uniform vec3  uRimTint;
uniform float uGain;      // Helligkeit * Einblendung
uniform float uLine;
uniform float uLineW;     // Linienbreite (Sigma, Pixel)

out vec4 outColor;

const float BIG   = 50.0;
const float KB    = 0.28;   // Weichheit an Nahtstellen
// Licht (linearer Farbraum)
const float KEY   = 0.046;
const float PT    = 0.085;
const float FILL  = 0.0068;
const float SHEEN = 0.030;
const float POOL  = 0.0010;
const float RIM0  = 0.0030;
const float RIM1  = 1.25;

vec3 sdSeg(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  vec2 d = pa - ba * h;
  float l = length(d);
  return vec3(l, d / max(l, 1e-6));
}

// Viertelbogen, Radius 1, Mittelpunkt c = (+-1, +-1), Enden (c.x,0) und (0,c.y)
vec3 sdArc(vec2 p, vec2 c) {
  vec2 q = p * c;
  vec2 r = q - 1.0;
  vec3 res;
  if (r.x <= 0.0 && r.y <= 0.0) {
    float l = length(r);
    float d = l - 1.0;
    res = vec3(abs(d), (d >= 0.0 ? 1.0 : -1.0) * r / max(l, 1e-6));
  } else {
    vec2 a = q - vec2(1.0, 0.0), b = q - vec2(0.0, 1.0);
    float la = length(a), lb = length(b);
    res = la < lb ? vec3(la, a / max(la, 1e-6)) : vec3(lb, b / max(lb, 1e-6));
  }
  res.yz *= c;
  return res;
}

// weiches Minimum, das nur an echten Knicken glättet
vec3 smin3(vec3 a, vec3 b) {
  float k = KB * clamp(1.0 - dot(a.yz, b.yz), 0.0, 1.0) + 1e-4;
  float h = clamp(0.5 + 0.5 * (b.x - a.x) / k, 0.0, 1.0);
  return vec3(mix(b.x, a.x, h) - k * h * (1.0 - h), mix(b.yz, a.yz, h));
}

// Skelett eines Knotens (Bits: 1 = rechts, 2 = unten, 4 = links, 8 = oben)
vec3 nodeField(vec2 q, int m) {
  int deg = (m & 1) + ((m >> 1) & 1) + ((m >> 2) & 1) + ((m >> 3) & 1);
  if (deg == 1) {
    vec2 d = m == 1 ? vec2(1.0, 0.0) : m == 2 ? vec2(0.0, 1.0) : m == 4 ? vec2(-1.0, 0.0) : vec2(0.0, -1.0);
    return sdSeg(q, vec2(0.0), d);
  }
  vec3 r = vec3(BIG, 0.0, 0.0);
  if ((m & 5)  == 5)  r = smin3(r, sdSeg(q, vec2(-1.0, 0.0), vec2(1.0, 0.0)));
  if ((m & 10) == 10) r = smin3(r, sdSeg(q, vec2(0.0, -1.0), vec2(0.0, 1.0)));
  if ((m & 3)  == 3)  r = smin3(r, sdArc(q, vec2( 1.0,  1.0)));
  if ((m & 6)  == 6)  r = smin3(r, sdArc(q, vec2(-1.0,  1.0)));
  if ((m & 12) == 12) r = smin3(r, sdArc(q, vec2(-1.0, -1.0)));
  if ((m & 9)  == 9)  r = smin3(r, sdArc(q, vec2( 1.0, -1.0)));
  return r;
}

ivec2 maskAt(ivec2 n) {
  if (n.x < 0 || n.y < 0 || n.x >= uGrid.x || n.y >= uGrid.y) return ivec2(0);
  return ivec2(texelFetch(uMask, n, 0).rg * 255.0 + 0.5);
}

// Beleuchtung einer Flanke. t = Richtung, in die sich die Oberfläche neigt (|t| <= 1)
float flank(vec2 t, float v, float att, vec2 ld) {
  float prof = pow(v, 1.7);
  float ck = dot(t, uKey);
  float cp = dot(t, ld);
  float k  = max(ck, 0.0), p = max(cp, 0.0);
  float sh = pow(v, 8.0);
  float k2 = k * k, p2 = p * p;
  return KEY * prof * k * sqrt(k)
       + PT * att * prof * p * sqrt(p)
       + FILL * v * max(-ck, 0.0)
       + SHEEN * sh * (k2 * k2 * k2 * k2 + att * p2 * p2 * p2 * p2);
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 w = (p - uOrigin) / uS;
  vec2 nf = floor(w * 0.5 + 0.5);
  ivec2 n0 = ivec2(nf);
  vec2 q0 = w - 2.0 * nf;
  ivec2 sg = ivec2(q0.x >= 0.0 ? 1 : -1, q0.y >= 0.0 ? 1 : -1);

  vec3 fO = vec3(BIG, 0.0, 0.0);
  vec3 fN = vec3(BIG, 0.0, 0.0);
  for (int k = 0; k < 4; k++) {
    ivec2 off = ivec2(k & 1, k >> 1) * sg;
    vec2 q = q0 - 2.0 * vec2(off);
    ivec2 m = maskAt(n0 + off);
    if (uMorph == 0) {
      if (m.x != 0) fO = smin3(fO, nodeField(q, m.x));
    } else if (m.x == m.y) {
      if (m.x != 0) { vec3 f = nodeField(q, m.x); fO = smin3(fO, f); fN = smin3(fN, f); }
    } else {
      if (m.x != 0) fO = smin3(fO, nodeField(q, m.x));
      if (m.y != 0) fN = smin3(fN, nodeField(q, m.y));
    }
  }

  vec3 F = fO;
  if (uMorph != 0) {
    float f = clamp(dot(p, uFront.xy) + uFront.z + uWob.z * sin(dot(p, uWob.xy)), 0.0, 1.0);
    float u = clamp((uT - f * uDur.x) / uDur.y, 0.0, 1.0);
    float eN = 1.0 - smoothstep(0.0, 0.5, u);   // Neues wächst zuerst ...
    float eO = smoothstep(0.5, 1.0, u);         // ... dann zieht sich Altes zurück
    fO.x += 1.2 * eO;
    fN.x += 1.2 * eN;
    F = smin3(fO, fN);
  }

  float sd   = F.x - 0.5;               // < 0: Band, > 0: Zwischenraum
  float sdPx = sd * uS;
  vec2  g    = F.yz;
  float g2   = dot(g, g);
  vec2  gn   = g2 > 1e-8 ? g * inversesqrt(g2) : vec2(0.0);
  float v    = 1.0 - min(abs(sd), 0.5) * 2.0;

  vec2  lv  = uPL.xy - p;
  float d2  = dot(lv, lv);
  float h2  = uPL.z * uPL.z;
  float att = h2 / (d2 + h2);
  vec2  ld  = lv * inversesqrt(d2 + h2);

  float aIn = 1.0 - smoothstep(-0.75, 0.75, sdPx);
  float lit = mix(flank(-g, v, att, ld), flank(g, v, att, ld), aIn) + POOL * att;

  float ckL = abs(dot(gn, uKey)), cpL = abs(dot(gn, ld));
  float edge = KEY * ckL * sqrt(ckL) + PT * att * cpL * sqrt(cpL);
  float rim  = (RIM0 + RIM1 * edge) * exp(-0.5 * sdPx * sdPx / (uLineW * uLineW)) * uLine;

  vec3 col = (uTint * lit + uRimTint * rim) * uGain;
  col = col / (1.0 + 0.5 * col);

  vec3 srgb = mix(col * 12.92, 1.055 * pow(col, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, col));
  float n = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
  outColor = vec4(srgb + (n - 0.5) / 255.0, 1.0);
}`;

// ---------- WebGL ----------
const canvas = document.getElementById('c');
const msg = document.getElementById('msg');
const gl = canvas.getContext('webgl2', {
  alpha: false, antialias: false, depth: false, stencil: false,
  premultipliedAlpha: false, preserveDrawingBuffer: P.freeze !== null,
  powerPreference: 'low-power'
});
if (!gl) { msg.style.display = 'flex'; return; }

let prog = null, vao = null, tex = null, U = {}, maxDims = [8192, 8192];
const UNIFORMS = ['uRes', 'uOrigin', 'uS', 'uMask', 'uGrid', 'uMorph', 'uT', 'uDur', 'uFront', 'uWob',
  'uKey', 'uPL', 'uTint', 'uRimTint', 'uGain', 'uLine', 'uLineW'];

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS) && !gl.isContextLost()) {
    throw new Error(gl.getShaderInfoLog(sh));
  }
  return sh;
}

function setupGL() {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS) && !gl.isContextLost()) {
    throw new Error(gl.getProgramInfoLog(p));
  }
  prog = p;
  vao = gl.createVertexArray();
  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  U = {};
  for (const n of UNIFORMS) U[n] = gl.getUniformLocation(p, n);
  gl.useProgram(p);
  gl.uniform1i(U.uMask, 0);
  gl.disable(gl.DITHER);
  const md = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  if (md) maxDims = [md[0], md[1]];
}

// ---------- Labyrinth ----------
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1], BIT = [1, 2, 4, 8];
let L = null;          // aktuelles Layout
let uploaded = null;   // [alt, neu] für Kontext-Wiederherstellung

// Spannbaum per Tiefensuche: lange, gewundene Bänder
function genMaze(nx, ny) {
  const N = nx * ny, mask = new Uint8Array(N), seen = new Uint8Array(N);
  const start = Math.floor(rnd() * N);
  const stack = [[start, -1]];
  seen[start] = 1;
  while (stack.length) {
    const [c, pd] = stack[stack.length - 1];
    const cx = c % nx, cy = (c / nx) | 0;
    const cand = [];
    let tot = 0;
    for (let d = 0; d < 4; d++) {
      const x = cx + DX[d], y = cy + DY[d];
      if (x < 0 || y < 0 || x >= nx || y >= ny) continue;
      const n = y * nx + x;
      if (seen[n]) continue;
      const wgt = (d === pd ? 3 : 1) * (d % 2 === 0 ? 1.6 : 1);
      cand.push([d, n, wgt]);
      tot += wgt;
    }
    if (!cand.length) { stack.pop(); continue; }
    let r = rnd() * tot, k = 0;
    while (k < cand.length - 1 && (r -= cand[k][2]) > 0) k++;
    const [d, n] = cand[k];
    mask[c] |= BIT[d];
    mask[n] |= BIT[(d + 2) & 3];
    seen[n] = 1;
    stack.push([n, d]);
  }
  return mask;
}

function makeLayout(W, H) {
  const s = Math.min(W, H) / P.bands;
  const S2 = 2 * s;
  const ox = -S2 * (1 + rnd()), oy = -S2 * (1 + rnd());
  const nx = Math.ceil((W - ox) / S2) + 2, ny = Math.ceil((H - oy) / S2) + 2;
  const vis = {
    x0: Math.max(0, Math.ceil(-ox / S2)), x1: Math.min(nx - 1, Math.floor((W - ox) / S2)),
    y0: Math.max(0, Math.ceil(-oy / S2)), y1: Math.min(ny - 1, Math.floor((H - oy) / S2)),
  };
  return { W, H, s, ox, oy, nx, ny, vis, cur: new Uint8Array(nx * ny), maze: genMaze(nx, ny) };
}

// Kante des Baums entfernen und an anderer Stelle neu verbinden (bleibt ein Baum)
function mutate(src) {
  const { nx, ny, vis } = L, N = nx * ny;
  const m = src.slice();
  const isVis = (x, y) => x >= vis.x0 && x <= vis.x1 && y >= vis.y0 && y <= vis.y1;
  if (vis.x0 > vis.x1 || vis.y0 > vis.y1) return m;
  let done = 0;
  for (let tries = 0; tries < 80 && done < P.changes; tries++) {
    const x = vis.x0 + Math.floor(rnd() * (vis.x1 - vis.x0 + 1));
    const y = vis.y0 + Math.floor(rnd() * (vis.y1 - vis.y0 + 1));
    const i = y * nx + x;
    const ds = [];
    for (let d = 0; d < 4; d++) if (m[i] & BIT[d]) ds.push(d);
    if (!ds.length) continue;
    const d = ds[Math.floor(rnd() * ds.length)];
    const j = (y + DY[d]) * nx + (x + DX[d]);
    m[i] &= ~BIT[d];
    m[j] &= ~BIT[(d + 2) & 3];

    const comp = new Uint8Array(N);
    const st = [i];
    comp[i] = 1;
    while (st.length) {
      const c = st.pop(), cx = c % nx, cy = (c / nx) | 0;
      for (let e = 0; e < 4; e++) {
        if (!(m[c] & BIT[e])) continue;
        const nb = (cy + DY[e]) * nx + cx + DX[e];
        if (!comp[nb]) { comp[nb] = 1; st.push(nb); }
      }
    }
    const both = [], one = [];
    for (let c = 0; c < N; c++) {
      if (!comp[c]) continue;
      const cx = c % nx, cy = (c / nx) | 0;
      for (let e = 0; e < 4; e++) {
        const qx = cx + DX[e], qy = cy + DY[e];
        if (qx < 0 || qy < 0 || qx >= nx || qy >= ny) continue;
        const nb = qy * nx + qx;
        if (comp[nb] || (c === i && nb === j)) continue;
        const a = isVis(cx, cy), b = isVis(qx, qy);
        if (a && b) both.push([c, e, nb]); else if (a || b) one.push([c, e, nb]);
      }
    }
    const pool = both.length ? both : one;
    if (!pool.length) { m[i] |= BIT[d]; m[j] |= BIT[(d + 2) & 3]; continue; }
    const [c, e, nb] = pool[Math.floor(rnd() * pool.length)];
    m[c] |= BIT[e];
    m[nb] |= BIT[(e + 2) & 3];
    done++;
  }
  return m;
}

function upload(a, b) {
  uploaded = [a, b];
  const { nx, ny } = L;
  const data = new Uint8Array(nx * ny * 4);
  for (let i = 0; i < nx * ny; i++) { data[i * 4] = a[i]; data[i * 4 + 1] = b[i]; }
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, nx, ny, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
}

// ---------- Zeitablauf ----------
let simT = 0, trans = null, nextMorphAt = Infinity;

function beginTransition(from, to, sweep, local) {
  const a = rnd() * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a);
  const pr = [0, dx * L.W, dy * L.H, dx * L.W + dy * L.H];
  const m0 = Math.min(...pr), m1 = Math.max(...pr), k = 1 / Math.max(m1 - m0, 1);
  const wl = (Math.PI * 2) / (3.2 * L.s);
  trans = {
    t: 0, sweep, local, to,
    front: [dx * k, dy * k, -m0 * k],
    wob: [-dy * wl, dx * wl, 0.045],
  };
  upload(from, to);
}

function startIntro() {
  trans = null;
  L.cur = new Uint8Array(L.nx * L.ny);
  beginTransition(L.cur, L.maze, 2.4, 3.2);
}

function startMorph() {
  if (!L || trans) return;
  const next = mutate(L.cur);
  beginTransition(L.cur, next, 5.0, 5.5);
}

function step(dt) {
  simT += dt;
  if (trans) {
    trans.t += dt;
    if (trans.t >= trans.sweep + trans.local) {
      L.cur = trans.to;
      trans = null;
      upload(L.cur, L.cur);
      nextMorphAt = simT + P.morph;
    }
  } else if (P.morph > 0 && simT >= nextMorphAt) {
    startMorph();
  }
}

function draw() {
  const W = L.W, H = L.H, t = simT;
  const a = 1.22 + 0.38 * Math.sin(0.071 * t + PH[0]) + 0.16 * Math.sin(0.023 * t + PH[1]);
  const plx = W * (0.5 + 0.42 * Math.sin(0.049 * t + PH[2]));
  const ply = H * (0.5 + 0.40 * Math.sin(0.067 * t + PH[3]));
  const x = Math.min(simT / 1.8, 1), fade = x * x * (3 - 2 * x);

  gl.viewport(0, 0, W, H);
  gl.useProgram(prog);
  gl.bindVertexArray(vao);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform2f(U.uRes, W, H);
  gl.uniform2f(U.uOrigin, L.ox, L.oy);
  gl.uniform1f(U.uS, L.s);
  gl.uniform2i(U.uGrid, L.nx, L.ny);
  gl.uniform1i(U.uMorph, trans ? 1 : 0);
  gl.uniform1f(U.uT, trans ? trans.t : 0);
  gl.uniform2f(U.uDur, trans ? trans.sweep : 1, trans ? trans.local : 1);
  const fr = trans ? trans.front : [0, 0, 0], wb = trans ? trans.wob : [0, 0, 0];
  gl.uniform3f(U.uFront, fr[0], fr[1], fr[2]);
  gl.uniform3f(U.uWob, wb[0], wb[1], wb[2]);
  gl.uniform2f(U.uKey, Math.cos(a), Math.sin(a));
  gl.uniform3f(U.uPL, plx, ply, 0.55 * Math.min(W, H));
  gl.uniform3f(U.uTint, TINT[0], TINT[1], TINT[2]);
  gl.uniform3f(U.uRimTint, RIM_TINT[0], RIM_TINT[1], RIM_TINT[2]);
  gl.uniform1f(U.uGain, P.light * fade);
  gl.uniform1f(U.uLine, P.line);
  gl.uniform1f(U.uLineW, Math.max(0.9, 0.0036 * L.s));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ---------- Größe ----------
function targetSize() {
  const dpr = (window.devicePixelRatio || 1) * P.scale;
  let w = Math.max(1, Math.round(window.innerWidth * dpr));
  let h = Math.max(1, Math.round(window.innerHeight * dpr));
  const k = Math.min(1, maxDims[0] / w, maxDims[1] / h);
  return [Math.max(1, Math.floor(w * k)), Math.max(1, Math.floor(h * k))];
}

function applySize(w, h) {
  canvas.width = w;
  canvas.height = h;
  L = makeLayout(gl.drawingBufferWidth, gl.drawingBufferHeight);
  startIntro();
}

// ---------- Standbild ----------
function renderFrozen() {
  rnd = mulberry32(P.seed);
  simT = 0; trans = null; nextMorphAt = Infinity;
  const [w, h] = targetSize();
  applySize(w, h);
  for (let t = 0; t < P.freeze - 1e-9;) {
    const dt = Math.min(0.25, P.freeze - t);
    step(dt);
    t += dt;
  }
  draw();
}

// ---------- Schleife ----------
let running = true, raf = 0, lastDraw = -1, curKey = '', pendKey = null, pendSince = 0;

function checkSize(now) {
  const [w, h] = targetSize();
  const key = w + 'x' + h;
  if (!L) { applySize(w, h); curKey = key; return; }
  if (key === curKey) { pendKey = null; return; }
  if (key !== pendKey) { pendKey = key; pendSince = now; return; }
  if (now - pendSince > 250) { applySize(w, h); curKey = key; pendKey = null; }
}

function frame(now) {
  if (!running) return;
  raf = requestAnimationFrame(frame);
  checkSize(now);
  const active = !!trans || simT < 2;
  const gap = 1000 / (active ? P.fps : P.idle);
  if (lastDraw >= 0 && now - lastDraw < gap - 1.5) return;
  const dt = lastDraw < 0 ? 0 : Math.min((now - lastDraw) / 1000, 0.1);
  lastDraw = now;
  step(dt * P.speed);
  draw();
}

canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  running = false;
  cancelAnimationFrame(raf);
}, false);

canvas.addEventListener('webglcontextrestored', () => {
  setupGL();
  if (P.freeze !== null) { renderFrozen(); return; }
  if (L && uploaded) upload(uploaded[0], uploaded[1]);
  running = true;
  lastDraw = -1;
  raf = requestAnimationFrame(frame);
}, false);

try {
  setupGL();
} catch (err) {
  console.error(err);
  msg.textContent = 'Der Shader konnte nicht gestartet werden.';
  msg.style.display = 'flex';
  return;
}

if (P.freeze !== null) {
  renderFrozen();
  let tid = 0;
  window.addEventListener('resize', () => { clearTimeout(tid); tid = setTimeout(renderFrozen, 250); });
} else {
  window.addEventListener('pointerdown', () => startMorph());
  raf = requestAnimationFrame(frame);
}
})();
</script>
